name: CI

# Nothing here runs until the maintainer approves it: every run waits at the
# "approve" job, which uses the "ci" environment with the maintainer as its
# required reviewer. An approved run does the quick checks; the end-to-end
# suites run only when asked for, with the "full-ci" label on a pull request
# or "Run workflow" with "full" ticked.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:
    inputs:
      full:
        description: Also run the end-to-end suites
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  approve:
    name: approve
    # Adding any label other than full-ci starts nothing.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-24.04
    environment: ci
    timeout-minutes: 5
    steps:
      - run: echo "Approved; running for ${{ github.event_name }} on ${{ github.ref }}"

  fmt:
    name: rustfmt
    needs: [approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install && rustup show active-toolchain
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: [approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake
      - name: Install Rust
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
      - run: cargo clippy --all-targets --locked -- -D warnings

  # macOS is tested when a release is built, not on every change.
  test:
    name: cargo test
    needs: [approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake
      - name: Install Rust
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
      - run: cargo test --locked

  dashboard:
    name: dashboard build
    needs: [approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: npm ci
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: dashboard
        run: npm run build
      - name: Check dashboard/dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- dashboard/dist)" ]; then
            git status --short -- dashboard/dist
            echo "::error::dashboard/dist differs from a clean build. Run ./scripts/build-dashboard.sh and commit dashboard/dist."
            exit 1
          fi

  e2e-postgres:
    name: e2e Postgres (${{ matrix.image }})
    needs: [clippy]
    if: (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        image: ["postgres:14", "postgres:16", "postgres:18"]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/e2e-setup
      - run: ./scripts/e2e.sh
        env:
          PG_IMAGE: ${{ matrix.image }}

  e2e-compat:
    name: e2e ${{ matrix.database }}
    needs: [clippy]
    if: (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        database: [cockroach, yugabyte]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/e2e-setup
      - run: ./scripts/e2e-compat.sh ${{ matrix.database }}

  e2e-mysql:
    name: e2e MySQL (${{ matrix.image }})
    needs: [clippy]
    if: (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        image: ["mysql:8.4", "mariadb:11.4"]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/e2e-setup
      - name: MySQL proxy
        run: ./scripts/e2e-mysql.sh
        env:
          MYSQL_IMAGE: ${{ matrix.image }}
      - name: MySQL journal and undo
        run: ./scripts/e2e-mysql-journal.sh
        env:
          MYSQL_IMAGE: ${{ matrix.image }}

  e2e-clickhouse:
    name: e2e ClickHouse
    needs: [clippy]
    if: (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/e2e-setup
      - run: ./scripts/e2e-clickhouse.sh

  e2e-plugins:
    name: e2e plugins
    needs: [clippy]
    if: (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/e2e-setup
      - run: ./scripts/e2e-plugins.sh

  e2e-splunk:
    name: e2e Splunk exporter
    needs: [clippy]
    if: (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/e2e-setup
      - run: ./scripts/e2e-splunk.sh

  e2e-report:
    name: e2e compliance reports
    needs: [clippy]
    if: (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/e2e-setup
      - run: ./scripts/e2e-report.sh

  sim-undo:
    name: undo simulation
    needs: [clippy]
    if: (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/e2e-setup
      - run: ./scripts/sim-undo.sh

  e2e-sso:
    name: e2e single sign-on (Keycloak)
    needs: [approve]
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/e2e-setup
      - run: ./scripts/e2e-sso.sh
