[package]
name = "ariodb"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
pg_query = "6.2.1"
pgwire = "0.41.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
tokio-postgres = "0.7.18"
toml = "1.1.7"
uuid = { version = "1.27.0", features = ["v4"] }
