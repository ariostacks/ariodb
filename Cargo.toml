[package]
name = "ariodb"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license-file = "LICENSE"
repository = "https://github.com/roozjalali/ariodb"
publish = false

[dependencies]
argon2 = "0.6.0"
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
cel-interpreter = "0.10.0"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
form_urlencoded = "1.2.2"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "server", "tokio"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
libc = "0.2.190"
lz4_flex = { version = "0.11.5", default-features = false, features = ["std", "safe-decode"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls", "binlog"] }
pg_query = "6.2.1"
postgres-protocol = "0.6.12"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
rustls = "0.23.45"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.11.0"
sqlparser = { version = "0.63", features = ["visitor"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
tokio-rustls = "0.26.6"
toml = "1.1.7"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
uuid = { version = "1.27.0", features = ["v4"] }
webpki-roots = "1.0.9"
zstd = { version = "0.14.0", default-features = false }

[dev-dependencies]
aws-lc-rs = "1.18.1"
proptest = "1.11.0"

# mysql_common reads some negative TIME values with arithmetic that
# overflows; release builds wrap, and the journal detects the result.
# Debug builds would panic instead, so match release behaviour.
[profile.dev.package.mysql_common]
overflow-checks = false
